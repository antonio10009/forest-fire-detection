# Configuración de Netlify para Forest Fire Detection Dashboard
# Colocar este archivo en la RAÍZ del repositorio (C:\Incendio2026\netlify.toml)

[build]
  # Carpeta que contiene el frontend
  publish = "frontend"

[[headers]]
  for = "/*"
  [headers.values]
    # Seguridad básica
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
